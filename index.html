<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Champ Game Zone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EDF5; --ink:#1A2340; --muted:#56617F; --panel:#FFFFFF; --line:#D3D9E6;
  --led:#1A2033; --amber:#FFC233; --hot:#E4572E;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#0D1222; --ink:#E8ECF6; --muted:#9AA4BF; --panel:#161D33; --line:#283152; }
}
:root[data-theme="dark"]{ --bg:#0D1222; --ink:#E8ECF6; --muted:#9AA4BF; --panel:#161D33; --line:#283152; }
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif}
main{max-width:760px;margin:0 auto;padding:28px 16px 40px}
.sign{background:var(--led);border-radius:16px;padding:22px 20px 18px;color:#C9D0E4}
h1{font-family:'Teko',system-ui,sans-serif;font-weight:600;font-size:clamp(3rem,11vw,4.6rem);line-height:.85;margin:0;color:var(--amber)}
.sign p{margin:8px 0 0;font-size:1.05rem}
h2{font-size:1.1rem;margin:28px 0 12px}
.games{display:grid;gap:12px}
.game{display:flex;gap:16px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;color:inherit;text-decoration:none}
.game:hover{border-color:var(--ink)}
.game:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.thumb{flex:none;width:76px;height:76px;border-radius:12px;background:#2A3D6B;display:grid;place-items:center}
.game h3{font-family:'Teko',system-ui,sans-serif;font-weight:600;font-size:2rem;line-height:.9;margin:0}
.game p{margin:4px 0 0;color:var(--muted);line-height:1.4}
.soon{border-style:dashed;color:var(--muted)}
.soon .thumb{background:transparent;border:2px dashed var(--line);font-size:2rem;color:var(--muted)}
footer{margin-top:32px;color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
<main>
  <header class="sign">
    <h1>Champ Game Zone</h1>
    <p>Games made by basketballchamp123. Pick one and play.</p>
  </header>

  <h2>Games</h2>
  <div class="games">
    <a class="game" href="two-in-a-row/">
      <span class="thumb" aria-hidden="true">
        <svg width="46" height="46" viewBox="0 0 46 46"><circle cx="23" cy="23" r="20" fill="#E8722A"/><g fill="none" stroke="#4A2410" stroke-width="2.2"><path d="M3 23h40M23 3v40"/><path d="M9 9c6 6 6 22 0 28M37 9c-6 6-6 22 0 28"/></g></svg>
      </span>
      <span>
        <h3>Two in a Row</h3>
        <p>Make free throws in a row to level up. Miss two and run a down and back.</p>
      </span>
    </a>
    <div class="game soon">
      <span class="thumb" aria-hidden="true">+</span>
      <span>
        <h3>Next game</h3>
        <p>Coming soon.</p>
      </span>
    </div>
  </div>

  <footer>Made with Claude.</footer>
</main>
</body>
</html>
